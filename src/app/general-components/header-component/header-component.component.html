<header class="d-flex flex-wrap align-items-center justify-content-around py-0 mb-0 border-bottom">
  <div class="col-md-3 mb-2 justify-content-center">
    <a href="/inicio" class="d-inline-flex link-body-emphasis text-decoration-none">
      <img class="logo-duarte-letras" src="../../../assets/img/logo-duarte-letras.png" alt="logo-duarte-letras">
    </a>
  </div>

  <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
    <li><a routerLink="/home/inicio" class="nav-link px-2">Inicio</a></li>
    <li><a routerLink="/home/productos" class="nav-link px-2">Productos</a></li>
    <li><a routerLink="/home/mis-pedidos" class="nav-link px-2">Mis Pedidos</a></li>
    <li><a routerLink="/home/sobre-nosotros" class="nav-link px-2">Sobre Nosotros</a></li>
    <li><a routerLink="/home/perfil" class="nav-link px-2">Perfil</a></li>
  </ul>

  <div class="col-md-3 text-end mb-2 header-right-section">
    <ng-container *ngIf="isLoggedIn">
      <div class="d-flex align-items-center">
        <div class="d-flex align-items-center me-3">

          <a [routerLink]="['/home/perfil']" class="admin-link">
            <span class="admin-text">{{ userName }} {{ userLastName }}</span>
          </a>
          <a [routerLink]="['/home/perfil']" class="admin-link">
            <div class="admin-image">
              <img class="avatar" [src]="avatarImg ? avatarImg : '../../../../assets/img/usuario-black.png'"/>
            </div>
          </a>
        </div>
        <button type="button" class="btn btn-outline-primary me-2 carrito-button" (click)="openCartModal()">
          <img src="assets/icons/carrito-de-compras.png" class="icon-png" alt="Carrito de Compra">
        </button>
        <button type="button" class="btn btn-outline-primary" (click)="logout()">
          Cerrar Sesión
        </button>
      </div>
    </ng-container>

    <ng-container *ngIf="!isLoggedIn">
      <button type="button" class="btn btn-outline-primary me-2" routerLink="/login">
        Iniciar Sesión
      </button>
      <button type="button" class="btn btn-outline-primary" routerLink="/registrarse">
        Registrarse
      </button>
    </ng-container>
  </div>
</header>

<carrito *ngIf="showCartModal" (closeModal)="closeCartModal()"></carrito>
