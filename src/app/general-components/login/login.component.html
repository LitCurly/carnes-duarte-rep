<div class="login-container">
  <div class="login-form">
    <div class="login-header">
      <img class="logo" src="./assets/img/login/logo-duarte.webp" alt="Your Company">
      <h2>Iniciar Sesión</h2>
      <p>
        ¿No eres miembro?
        <a href="/registrarse" class="signup-link">Registrate ya!</a>
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Ingrese su correo electrónico" required>
        <div *ngIf="loginForm.get('email')?.errors?.['required']">El correo electrónico es requerido.</div>
        <div *ngIf="loginForm.get('email')?.errors?.['email']">El correo electrónico no es válido.</div>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Ingrese su contraseña" required>
        <div *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida.</div>
        <div *ngIf="loginForm.get('password')?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</div>
        <div *ngIf="incorrectPassword && loginForm.valid" class="invalid-feedback">Por favor, ingresa la contraseña correcta.</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="loading">Iniciar Sesión</button>
        <div *ngIf="loading" class="spinner">
          <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
        </div>
      </div>
    </form>

    <div class="login-footer">
      <div class="separator"> 0</div>
      <p>
        ¿Olvidaste tu contraseña?
        <a href="/recuperar-contraseña" class="signup-link">Ingresa aquí</a>
      </p>
    </div>
  </div>
  <div class="login-image">
    <img src="./assets/img/login/carnesLogin.webp" alt="Background Image">
  </div>
</div>
