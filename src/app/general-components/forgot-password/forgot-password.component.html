<div class="login-container">
  <div class="login-form">
    <div class="login-header">
      <a href="/inicio">
        <img class="logo" src="./assets/img/login/logo-duarte.webp" alt="Carnes Duarte" />
      </a>
      <h2>Recuperar Contraseña</h2>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Ingrese su correo electrónico"
          required
        />
        <div *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">
          El correo electrónico es requerido.
        </div>
        <div *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">
          El correo electrónico no es válido.
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="loading">Enviar Correo de Recuperación</button>
        <div *ngIf="loading" class="spinner">
          <span class="sr-only">Cargando...</span>
        </div>
      </div>
    </form>

    <div class="login-footer">
      <div class="separator"></div>
      <p>
        ¿Recuerdas tu contraseña?
        <a href="/login" class="signup-link">Inicia sesión</a>
      </p>
    </div>
  </div>

  <div class="login-image">
    <img src="./assets/img/login/carnesRegister.webp" alt="Background Image" />
  </div>
</div>
