<div class="flex flex-col sm:flex-row h-screen">
  <div class="flex flex-col justify-center items-center sm:w-1/4 p-6 sm:p-12 bg-black text-white h-full">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <a href="/inicio">
          <img class="mx-auto mb-4" src="./assets/img/login/logo-duarte.webp" alt="Carnes Duarte" />
        </a>
        <h2 class="text-2xl font-semibold">Recuperar contraseña</h2>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()">
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="mt-1 block w-full px-4 py-2 border border-gray-300 text-gray-950 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500"
            placeholder="Ingrese su correo electrónico"
            required
          />
          <div
            *ngIf="forgotPasswordForm.get('email')?.errors?.['required']"
            class="text-red-500 text-sm mt-1"
          >
            El correo electrónico es requerido.
          </div>
          <div *ngIf="forgotPasswordForm.get('email')?.errors?.['email']" class="text-red-500 text-sm mt-1">
            El correo electrónico no es válido.
          </div>
        </div>
        <div class="mb-6 flex justify-between items-center">
          <button
            type="submit"
            class="w-full bg-red-700 text-white px-4 py-2 rounded-md hover:bg-red-800 focus:outline-none"
            [disabled]="loading"
          >
            Enviar correo de verificación
          </button>
          <div *ngIf="loading" class="lds-ring w-8 h-8 ml-2">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </form>

      <div class="text-center mt-4">
        <div class="border-t border-gray-200 py-4">
          <p class="text-sm">
            ¿Recuerdas tu contraseña?
            <a href="/login" class="text-red-500 hover:text-red-400">Inicia Sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="login-image">
    <img src="./assets/img/login/carnesRegister.webp" alt="Background Image" />
  </div>
</div>
