<div>
  <div
    class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex lg:w-72 lg:flex-col"
    [ngClass]="{ 'w-72': !sidebarClosed, 'w-16': sidebarClosed }"
  >
    <div class="flex grow flex-col gap-y-5 overflow-y-auto bg-black px-6 pb-4">
      <a href="/admin/home/dashboard" class="flex h-16 shrink-0 items-center justify-center">
        <img class="h-14 w-auto" src="./assets/img/logo-duarte-letras.png" alt="Carnes Duarte" />
      </a>

      <nav class="flex flex-1 flex-col">
        <ul role="list" class="flex flex-1 flex-col gap-y-7">
          <li>
            <ul role="list" class="-mx-2 space-y-1">
              <li
                routerLinkActive="bg-red-700 text-white rounded-md"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a
                  routerLink="/admin/home/dashboard"
                  class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold text-gray-50 border border-transparent hover:bg-red-800 hover:text-white hover:border-red-600"
                >
                  <svg
                    class="size-6 shrink-0"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                    />
                  </svg>
                  Dashboard
                </a>
              </li>

              <li
                routerLinkActive="bg-red-700 text-white rounded-md"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a
                  routerLink="/admin/home/gestionar-productos"
                  class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold text-gray-50 border border-transparent hover:bg-red-800 hover:text-white hover:border-red-600"
                >
                  <svg
                    class="size-6 shrink-0"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"
                    />
                  </svg>
                  Gestionar productos
                </a>
              </li>

              <li
                routerLinkActive="bg-red-700 text-white rounded-md"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a
                  routerLink="/admin/home/gestionar-usuarios"
                  class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold text-gray-50 border border-transparent hover:bg-red-800 hover:text-white hover:border-red-600"
                >
                  <svg
                    class="size-6 shrink-0"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                    />
                  </svg>
                  Gestionar usuarios
                </a>
              </li>

              <li
                routerLinkActive="bg-red-700 text-white rounded-md"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <a
                  routerLink="/admin/home/revisar-pedidos"
                  class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold text-gray-50 border border-transparent hover:bg-red-800 hover:text-white hover:border-red-600"
                >
                  <svg
                    class="size-6 shrink-0"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M10.5 6a7.5 7.5 0 1 0 7.5 7.5h-7.5V6Z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M13.5 10.5H21A7.5 7.5 0 0 0 13.5 3v7.5Z"
                    />
                  </svg>
                  Revisar pedidos
                </a>
              </li>
            </ul>
          </li>

          <li class="mt-auto flex justify-center items-center">
            <a
              *ngIf="!sidebarClosed"
              (click)="logout()"
              class="group flex gap-x-3 rounded-md p-2 text-sm/6 font-semibold text-gray-50 hover:bg-red-800 hover:text-white cursor-pointer"
            >
              Cerrar Sesión
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="lg:pl-72">
    <div
      class="sticky top-0 z-40 flex h-16 shrink-0 items-center justify-end border-b border-gray-200 bg-black px-4 shadow-sm lg:px-8"
    >
      <div class="relative">
        <button
          type="button"
          class="-m-1.5 flex items-center p-1.5"
          id="user-menu-button"
          aria-expanded="false"
          aria-haspopup="true"
          (click)="toggleDropdown()"
        >
          <span class="sr-only">Abrir menú usuario</span>
          <img
            class="size-8 rounded-full bg-gray-50"
            [src]="avatarImg ? avatarImg : '../../../../assets/img/usuario-black.png'"
          />
          <span class="flex items-center ml-4 text-sm font-semibold text-gray-50">
            {{ userName }} {{ userLastName }}
            <svg class="ml-2 size-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
        </button>

        <div
          *ngIf="showDropdown"
          class="absolute right-0 z-10 mt-2.5 w-32 origin-top-right rounded-md bg-gray-950 py-2 shadow-lg ring-1 ring-gray-900/5 focus:outline-none"
          role="menu"
          aria-orientation="vertical"
          aria-labelledby="user-menu-button"
        >
          <a
            routerLink="/admin/home/profile"
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800 lg:hidden"
            role="menuitem"
            id="user-menu-item-0"
          >
            Dashboard
          </a>
          <a
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800 lg:hidden"
            role="menuitem"
            id="user-menu-item-1"
          >
            Gestionar Productos
          </a>
          <a
            routerLink="/admin/home/profile"
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800 lg:hidden"
            role="menuitem"
            id="user-menu-item-2"
          >
            Usuarios
          </a>
          <a
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800 lg:hidden"
            role="menuitem"
            id="user-menu-item-3"
          >
            Revisar Pedidos
          </a>
          <div class="block lg:hidden text-white text-center w-full">------ o ------</div>

          <a
            routerLink="/admin/home/profile"
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800"
            role="menuitem"
            id="user-menu-item-4"
          >
            Perfil
          </a>
          <a
            (click)="logout()"
            class="block px-3 py-1 text-sm text-gray-50 cursor-pointer hover:bg-gray-800"
            role="menuitem"
            id="user-menu-item-5"
          >
            Cerrar sesión
          </a>
        </div>
      </div>
    </div>

    <main class="px-4 py-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
